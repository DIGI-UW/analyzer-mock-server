name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate JSON templates
        run: |
          python -c "
          import json
          import glob
          for f in glob.glob('templates/*.json'):
              print(f'Validating {f}...')
              json.load(open(f))
          print('All templates valid')
          "

      - name: Run unit tests
        run: |
          python -m pytest test_hl7.py test_protocols.py test_priority_profile_templates.py test_bridge_profile_adapter.py test_analyzers_api.py test_analyzer_network_manager.py test_simulate_qc_default_contract_api.py test_simulate_astm_qc_api.py test_file_output_paths.py test_fixture_parser.py test_fixture_messages.py test_sender_identity.py test_completed_at.py -v --tb=short

      - name: Validate Python syntax
        run: |
          python -m py_compile server.py template_loader.py profile_adapter.py api.py analyzer_network_manager.py
          python -m py_compile protocols/*.py
          python -m py_compile generate_file.py
          echo "All Python files have valid syntax"
